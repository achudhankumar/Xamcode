# XamCode AI — continuous integration.
#
# Runs on pushes and pull requests to main: syntax checks + the full
# offline unit suite (npm test). No production API keys are needed —
# every test in the chain uses stubbed providers, scratch quota files,
# or scratch data dirs.
#
# DELIBERATELY NOT RUN HERE (quota / credentials / network cost):
#   test-pdf-subject-e2e.js .... spends a real Gemini generation
#   test-chunk-live.js ......... live pipeline against sample PDFs
#   test-pdf-allowance.js ...... burns the caller's whole daily allowance
#   test-journey-smoke.js ...... boots the server on a fixed local port
# Those stay manual: `npm run test:e2e`, `npm run test:smoke`.
# No deploy, DNS, or secret-echo steps live in this file by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Build lifecycle telemetry: report build_started BEFORE the build runs.
      # continue-on-error so a reporting hiccup can never block the real build —
      # the reporter still emits a visible ::error:: when it fails. REF carries the
      # commit this run is building; the reporter skips silently on fork PRs (no secrets).
      - name: Report build started to Build-in-Public ingest
        continue-on-error: true
        env:
          BIP_INGEST_TOKEN: ${{ secrets.BIP_INGEST_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PUBLIC_URL_SECRET: ${{ secrets.PUBLIC_URL }}
          REF: ${{ github.sha }}
          DEDUPE_KEY: ci-build-start-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE: ci
        run: |
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          EVENT_TYPE="build_started" SUMMARY="CI build started @ $SHORT_SHA (run $GITHUB_RUN_ID)" node .github/report-bip.js
      - run: npm ci
      - id: build
        run: npm run check
      - id: tests
        run: npm test
      # Build outcome: reported from the syntax/load gate (`npm run check`, id:
      # build) — NEVER derived from the test result, so a green test run can never
      # masquerade as a successful build. Runs even if earlier steps failed and
      # exits nonzero with a visible ::error:: if the report itself fails, without
      # altering the build step's own outcome (it reads steps.build.outcome).
      - name: Report build result to Build-in-Public ingest
        if: always()
        env:
          BIP_INGEST_TOKEN: ${{ secrets.BIP_INGEST_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PUBLIC_URL_SECRET: ${{ secrets.PUBLIC_URL }}
          REF: ${{ github.sha }}
          DEDUPE_KEY: ci-build-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE: ci
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          if [ "$BUILD_OUTCOME" = "success" ]; then
            ET="build_passed"; SUM="CI build passed @ $SHORT_SHA (run $GITHUB_RUN_ID)"
          else
            ET="build_failed"; SUM="CI build failed @ $SHORT_SHA (run $GITHUB_RUN_ID) [${BUILD_OUTCOME:-unknown}]"
          fi
          EVENT_TYPE="$ET" SUMMARY="$SUM" node .github/report-bip.js
      # P0-2: Report real CI test results to the Xamcode BIP telemetry.
      # Runs even when tests fail and never masks the test outcome.
      # HTTP 200 alone is NOT trusted: the response body must confirm
      # the event was stored (or was a legitimate idempotent duplicate).
      # A reporting failure fails THIS step visibly via ::error:: — the
      # job's own test result is independent and never overwritten.
      # No secrets are echoed in any log line.
      - name: Report test result to Build-in-Public ingest
        if: always()
        env:
          BIP_INGEST_TOKEN: ${{ secrets.BIP_INGEST_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          PUBLIC_URL_SECRET: ${{ secrets.PUBLIC_URL }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ -z "$BIP_INGEST_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "BIP ingest skipped: secrets are unavailable for pull_request events (expected for fork PRs)."
              exit 0
            fi
            echo "::error::BIP ingest reporting failed: BIP_INGEST_TOKEN secret is not configured on this repository."
            exit 1
          fi
          TARGET_URL="${PUBLIC_URL:-$PUBLIC_URL_SECRET}"
          if [ -z "$TARGET_URL" ]; then
            # Documented fallback: main XamCode API backend (service xamcode-ai).
            # Set the PUBLIC_URL variable / PUBLIC_URL secret in GitHub Actions
            # instead of relying on this fallback in production.
            TARGET_URL="https://xamcode-ai.onrender.com"
          fi
          # Strip any trailing slash so the path join is stable.
          TARGET_URL="${TARGET_URL%/}"
          if [ "$TESTS_OUTCOME" = "success" ]; then
            EVENT_TYPE="tests_passed"
            SUMMARY="CI tests passed"
          else
            EVENT_TYPE="tests_failed"
            SUMMARY="CI tests failed"
          fi
          SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-7)"
          DEDUPE_KEY="ci-tests-${RUN_ID}-${RUN_ATTEMPT}"
          BODY_FILE="$(mktemp)"
          # Timeout + one retry only. The Bearer token is passed via
          # header only and never echoed. The RESPONSE BODY is now
          # validated too: the endpoint returns HTTP 200 with stored:0
          # for duplicates and rejected events alike, so the status
          # code alone never proved the event landed.
          set +x
          set +e
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 15 --connect-timeout 10 --retry 1 \
            -X POST "$TARGET_URL/api/bip/events/ingest" \
            -H "Authorization: Bearer $BIP_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"$EVENT_TYPE\",\"summary\":\"$SUMMARY on main @ $SHORT_SHA (run $RUN_ID)\",\"ref\":\"$COMMIT_SHA\",\"dedupeKey\":\"$DEDUPE_KEY\",\"source\":\"ci\"}" \
            -o "$BODY_FILE" -w "%{http_code}")
          CURL_EXIT=$?
          set -e
          BODY="$(cat "$BODY_FILE" 2>/dev/null || true)"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::BIP ingest reporting failed: transport error (curl exit $CURL_EXIT, HTTP ${HTTP_CODE:-000}). CI test result is unaffected."
            rm -f "$BODY_FILE"
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            # 401 = token mismatch, 503 = ingest or durable storage not
            # configured server-side. All are reporting failures.
            echo "::error::BIP ingest reporting failed - HTTP $HTTP_CODE. Body: $(printf '%.300s' "$BODY")"
            rm -f "$BODY_FILE"
            exit 1
          fi
          # JSON contract check: received=true, no rejected events, and
          # stored>=1 or duplicates>=1 (a legitimate idempotent retry).
          VERDICT=$(node -e '
            const fs = require("fs");
            let body;
            try { body = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("MALFORMED_RESPONSE"); process.exit(0); }
            if (body.received !== true) { console.log("NO_RECEIPT"); process.exit(0); }
            if (Array.isArray(body.errors) && body.errors.length > 0) {
              console.log("EVENT_REJECTED:" + body.errors.join(","));
              process.exit(0);
            }
            const stored = Number(body.stored) || 0;
            const dup = Number(body.duplicates) || 0;
            if (stored + dup < 1) { console.log("NOT_STORED"); process.exit(0); }
            console.log("OK stored=" + stored + " duplicates=" + dup);
          ' "$BODY_FILE")
          rm -f "$BODY_FILE"
          case "$VERDICT" in
            OK*)
              echo "BIP ingest report OK - HTTP $HTTP_CODE, ${VERDICT#OK }."
              ;;
            MALFORMED_RESPONSE)
              echo "::error::BIP ingest reporting failed - HTTP 200 with a malformed response body. Body: $(printf '%.300s' "$BODY")"
              exit 1
              ;;
            NO_RECEIPT)
              echo "::error::BIP ingest reporting failed - response missing received=true."
              exit 1
              ;;
            EVENT_REJECTED:*)
              echo "::error::BIP ingest reporting failed - server rejected the event ($VERDICT)."
              exit 1
              ;;
            NOT_STORED)
              echo "::error::BIP ingest reporting failed - HTTP 200 but the event was NOT stored (storage failure or silent drop)."
              exit 1
              ;;
            *)
              echo "::error::BIP ingest reporting failed - unexpected validator output."
              exit 1
              ;;
          esac
